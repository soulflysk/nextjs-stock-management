services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports: ["1433:1433"]
    volumes: ["sql_data:/var/opt/mssql"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend/StockManagement.Api
    depends_on: [sqlserver, redis]
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StockManagementDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      Redis__Connection: "redis:6379"
      Jwt__Key: "ChangeThisDevelopmentSecretKey_AtLeast32Chars!"
    ports: ["5000:8080"]
  web:
    build: .
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
    ports: ["3000:3000"]
volumes:
  sql_data:
